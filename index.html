{id:"t1",nr:"Tema 1",title:"Omul și mediul. Popoarele Orientului Antic",color:"#0e7490",
explain:[
"Orientul Antic este numele regiunilor din nord-estul Africii și din Asia unde au apărut primele civilizații. Istoria lui ține din mileniul al IV-lea î.H. până în primele veacuri ale erei noastre, de la Marea Mediterană până la Oceanul Pacific.",
"Primele civilizații au apărut lângă marile fluvii, de aceea se numesc civilizații fluviale. Mesopotamia, adică „între două râuri”, se afla între Tigru și Eufrat. Egiptul era pe valea Nilului. India Antică, pe fluviile Ind și Gange. China Antică, pe fluviile Huang He, numit Fluviul Galben, și Yangtze, numit Fluviul Albastru.",
"Fluviile le dădeau oamenilor hrană și apă, erau sursa de irigare și o cale de comerț. Semiluna Fertilă, numită și Cornul Abundenței, era o regiune foarte roditoare în formă de lună: Egiptul, Fenicia, Mesopotamia, Asiria și Sumerul.",
"Natura era diferită de la o țară la alta. Egiptul era înconjurat de deșert la est și la vest. Mesopotamia avea podiș în nord și câmpie în sud, cu ierni blânde și ploioase și veri calde și uscate. Fenicia era pe malul de est al Mării Mediterane. Persia, pe Podișul Iranului, avea veri foarte călduroase și ierni geroase.",
"India avea două anotimpuri: iarna rece și uscată și vara toridă, cu ploi torențiale. De aceea avea multe plante și animale. China avea climă de la tropicală în sud la continentală în nord: în vest munți, platouri și deșerturi, iar în est câmpii, delte și dealuri.",
"Popoarele Orientului Antic erau de patru origini: indo-europeană, semită, hamită și sino-tibetană. Indo-europenii au venit din Asia Centrală. Semiții erau păstori nomazi din deșerturile Asiei de Vest, care s-au așezat în Mesopotamia și pe malul Mediteranei.",
"În Mesopotamia au trăit sumerienii, pe care manualul îi numește indo-europeni, apoi akadienii, amoriții, asirienii și chaldeenii, care erau semiți. Egiptenii erau de origine semito-hamită. Evreii și fenicienii erau semiți. Perșii, indo-europeni, s-au așezat pe Podișul Iranian. Chinezii erau sino-tibetani.",
"În India, dravidienii au creat Civilizația Harappa, în Valea Indului, între 3000 și 1600 î.H. Orașele Mohenjo-Daro și Harappa aveau străzi drepte, case din cărămidă arsă cu mai multe niveluri și canalizare. Locuitorii aveau și un sistem de scriere. Civilizația a dispărut în 1500 î.H. și nu se știe de ce. La mijlocul mileniului al II-lea î.H. au venit arienii, păstori nomazi, care au asimilat populația locală.",
"Ocupațiile principale erau agricultura și creșterea animalelor. Agricultura cu irigație însemna secarea mlaștinilor, diguri, lacuri artificiale și canale. În Egipt Nilul se revărsa în fiecare an și lăsa un mâl negru, roditor. Diodor din Sicilia scria că în Egipt agricultura se face cu muncă puțină: arunci sămânța, vitele o calcă, iar după patru-cinci luni seceri. În China se practica agricultura pe straturi.",
"Meșteșugurile: egiptenii erau pricepuți la bijuterii, corăbii, metale și papirus. Fenicienii, la vopsirea pânzelor, corăbii și sticlă. Mesopotamienii, la prelucrarea pielii, țesut și pâine. Chinezii, la mătase, fier și porțelan. Indienii, la bijuterii, țesut și zahăr din trestie.",
"Comerțul se făcea pe uscat, cu caravane de catâri, cămile și elefanți, și pe apă, cu luntri, galere și corăbii. Cele mai vestite drumuri au fost Drumul Regilor, între Egipt și Mesopotamia, și Drumul Mătăsii, între Marea Mediterană și estul Asiei. China vindea mătase, porțelan și ceai, India vindea piper, perle și pietre prețioase, iar Egiptul vindea grâne, aur și papirus."
],
cards:["Civilizație|Nivelul de dezvoltare materială și spirituală a unui popor","Civilizație fluvială|Civilizație formată lângă un mare fluviu, care depinde de revărsări și de irigare","Sistem de irigare|Canale și mecanisme care duc apa departe de râu","Hamiți|Grup de popoare din nordul Africii","Semiluna Fertilă|Regiune foarte roditoare în formă de lună, numită și Cornul Abundenței","Mesopotamia|„Între două râuri”, adică între Tigru și Eufrat","Civilizația Harappa|Civilizația din Valea Indului (3000–1600 î.H.)","Arienii|Triburi indo-europene de păstori care au venit în India","Drumul Mătăsii|Drum comercial între Marea Mediterană și estul Asiei","Drumul Regilor|Drum comercial între Egipt și Mesopotamia","Mâl|Pământ negru și roditor lăsat de Nil după revărsare"],

{id:"t2",nr:"Tema 2",title:"Modul de viață în Orientul Antic",color:"#15803d",
explain:[
"Modul de viață înseamnă alimentația, locuința, vestimentația, familia și tradițiile. El depindea de natură, de ocupație, de bogăție și de tradiții.",
"Alimentația. În Egipt se mânca pâine, legume, fructe și pește, iar carnea doar rar. Se bea bere din orz și vin din curmale sau din struguri. În Mesopotamia hrana de bază era orzul, grâul și curmalele, iar carnea o mâncau doar bogații. Pâinea era o turtă plată, nedospită, și existau peste 300 de cuvinte pentru ea. Curmalul era numit arborele vieții și regele oazelor. Herodot scria că babilonienii foloseau ulei de susan, nu de măsline.",
"În China grâul era mâncarea tradițională, iar orezul îl mâncau doar familiile bogate. Chinezii mâncau cu bețișoare și au creat tradiția servirii ceaiului. În India existau tabuuri, adică interdicții sfinte: nu se mânca carne de vită, porc, cocoș și lebădă. Mulți indieni erau vegetarieni și țineau post.",
"Locuința. În Egipt săracii trăiau în colibe din papirus sau în case din cărămidă crudă, iar bogații în case cu două niveluri. În Mesopotamia casele erau dreptunghiulare, cu o curte interioară, și erau construite din cărămidă crudă, pentru că piatra se găsea greu. În China acoperișul trainic era simbolul protecției: la bogați din olane, la săraci din rogojini unse cu lut. În India bogații aveau case cu terasă și grădină, iar săracii o singură cameră.",
"Portul. Egiptencele purtau cămăși lungi din in, iar bărbații o fustă scurtă cu centură. Preoții aveau capul ras, iar mulți oameni umblau desculți. Egiptenii iubeau podoabele. În Mesopotamia bărbații purtau tunică și o eșarfă lungă în care își țineau sabia și pumnalul, iar iarna cojoc. Aveau barba lungă, încrețită cu fierul.",
"În China bărbații purtau pantaloni, cămașă, halat și brâu. Lungimea halatului arăta poziția socială, iar a merge desculț era necuviincios. Cei bogați purtau pantofi de mătase. În India bărbații purtau dhoti, o fâșie de pânză înfășurată pe șolduri și picioare. Bogații purtau in și mătase, săracii bumbac. Bijuteriile arătau statutul social și material.",
"Familia era, de obicei, monogamă, adică un soț și o soție. În Egipt femeia era stăpâna casei și egală cu bărbatul. În Mesopotamia copiii puteau fi vânduți pentru datorii. În China cel mai bătrân bărbat avea putere nelimitată. În India nu erau permise căsătoriile între caste, iar moșteneau doar băieții.",
"Sărbătorile. În Egipt Anul Nou era sărbătoarea revărsării Nilului. În Mesopotamia Anul Nou ținea 12 zile și era legat de zeul Marduk: nu se lucra, nu se judeca și nu se pedepsea nimeni. În China la Anul Nou participau 120 de băieți cu tobe, erau artificii, iar sărbătoarea se încheia cu Festivalul Lampioanelor. În India se iubeau cântecul, dansul, poveștile și jocul de șah."
],
cards:["Cărămidă crudă|Cărămidă din argilă cu paie, fibre de in sau păr de cal","Rogojină|Împletitură din papură sau rogoz","Tabu|Interdicție sfântă, pedepsită aspru","Dhoti|Fâșie de pânză purtată de bărbații din India","Curmalul|„Arborele vieții” și „regele oazelor”","Familie monogamă|Familie cu un singur soț și o singură soție","Festivalul Lampioanelor|Sfârșitul Anului Nou chinezesc","Olane|Țiglele din care bogații chinezi făceau acoperișul"],

{id:"t3",nr:"Tema 3",title:"Orașe-state, regate și imperii: Mesopotamia, Babilonul, Egiptul",color:"#b45309",
explain:[
"Primele state au apărut în mileniul al IV-lea î.H. Statul a apărut ca să organizeze munca, de exemplu canalele de irigare, dar și viața religioasă, ordinea și apărarea. Statele au avut trei forme: orașe-state, regate și imperii.",
"Orașul-stat era un oraș cu pământurile din jur, condus de un rege. Regatul s-a format din orașe-state sau din triburi ale aceluiași popor. Imperiul s-a format din regatele care au cucerit alte teritorii, așa că avea multe popoare.",
"În Mesopotamia sumerienii erau organizați în orașe-state: Ur, Uruk, Nippur, Eridu, Umma și Lagaș. Regele se numea lugal și avea putere politică și religioasă. La sfârșitul mileniului al III-lea î.H., regele Sargon i-a supus pe sumerieni și a creat primul imperiu din Asia, Imperiul Akadian, care a durat puțin. În secolul al VII-lea î.H. cel mai puternic a fost Imperiul Asirian, cu capitala la Ninive.",
"Societatea din Mesopotamia avea în frunte regele-preot, apoi aristocrația, apoi oamenii liberi, adică țăranii și meșteșugarii, iar la urmă sclavii.",
"Babilonul a fost un oraș-stat pe malurile Eufratului. Primul lui rege a fost Sumulael. Cel mai mare rege a fost Hammurabi, între 1792 și 1750 î.H. El a unit aproape toată Mesopotamia și a creat un imperiu, a construit canale și temple și avea o armată permanentă. Zeul Marduk a devenit zeul principal.",
"În 1760 î.H. a apărut Codul lui Hammurabi, una dintre primele culegeri de legi, cu 282 de articole, sculptate pe o stelă de piatră. Codul împărțea oamenii în trei categorii: amelu, adică bogații, mușkenum, adică oamenii obișnuiți, și ardu, adică sclavii. După moartea lui Hammurabi imperiul s-a destrămat.",
"A doua înflorire a Babilonului a fost sub regele Nabucodonosor al II-lea, între 605 și 562 î.H. Babilonul a devenit cel mai mare oraș din Orientul Antic, cu 200.000 de locuitori. Aici era ziguratul Etemenanki, înalt de 91 de metri, numit în Biblie Turnul Babel, și Poarta Zeiței Ishtar, înaltă de 12 metri. În 538 î.H. Babilonul a fost cucerit de perși.",
"În Egipt, satele de pe Nil se numeau nome. Ele s-au unit în două regate: Egiptul de Sus și Egiptul de Jos. În anul 3000 î.H. regele Menes le-a unit și s-a proclamat faraon. Faraonul era considerat fiul zeului Ra și avea putere nelimitată. Era ajutat de Consiliul celor 10. Capitala a fost Memfis.",
"În Regatul Mijlociu capitala a fost Teba, lângă Valea Regilor, unde erau înmormântați faraonii. Din 1550 î.H., în Regatul Nou, Egiptul a fost cel mai puternic. Tutmes al III-lea a făcut cuceriri. Akhenaton a impus un singur zeu, Aton. Tutankhamon a revenit la vechii zei. Ramses al II-lea a fost cel mai puternic faraon și conducea singur armata în luptă. Nefertiti a fost regina, soția lui Amenhotep al IV-lea. În 671 î.H. Egiptul a fost cucerit de asirieni."
],

tf:["Imperiul cuprindea multe popoare.|1|","Codul lui Hammurabi era scris pe papirus.|0|Era sculptat pe o stelă de piatră.","Imperiul Akadian a durat foarte mult.|0|A avut o existență scurtă.","Faraonul avea putere nelimitată.|1|","Tutankhamon a revenit la zeii tradiționali.|1|","Poarta Zeiței Ishtar avea 12 metri înălțime.|1|","Babilonul se afla pe malurile Nilului.|0|Se afla pe ambele maluri ale Eufratului.","Satele de pe valea Nilului se numeau nome.|1|","Menes a unit Egiptul de Sus și Egiptul de Jos.|1|","Ziguratul Etemenanki era numit în Biblie Turnul Babel.|1|"],

oral:["Ce forme a avut statul în Orientul Antic?|Orașul-stat, regatul și imperiul.|oras,regat,imperi","Ce știi despre Hammurabi?|A fost regele Babilonului între 1792 și 1750 î.H., a unit Mesopotamia într-un imperiu și a creat Codul lui Hammurabi, cu 282 de legi.|babilon,cod/legi,imperi/mesopotamia","Ce categorii sociale avea Codul lui Hammurabi?|Amelu, adică bogații, mușkenum, adică oamenii obișnuiți, și ardu, adică sclavii.|amelu/bogat,muskenum/obisnuit,ardu/sclav","Cine a fost faraonul și ce puteri avea?|Conducătorul Egiptului, considerat fiul zeului Ra, cu putere nelimitată, politică și religioasă.|ra,nelimitat/putere,egipt","Ce construcții vestite avea Babilonul lui Nabucodonosor al II-lea?|Ziguratul Etemenanki, adică Turnul Babel, Poarta Zeiței Ishtar, un pod lung și un zid dublu.|etemenanki/zigurat/babel,ishtar/poarta"],

{id:"t4",nr:"Tema 4",title:"Orașe-state, regate și imperii: Persia, India, China",color:"#be123c",
explain:[
"În Persia, India și China statele au devenit imperii, iar conducătorii aveau toată puterea.",
"Imperiul Persan. Triburile perșilor au fost unite de Achaemenes în jurul anului 700 î.H. Cirus al II-lea cel Mare a creat imperiul: a cucerit Lidia, orașele grecești din Asia Mică, Babilonul, Siria, Fenicia și Israelul. Cambyses al II-lea a cucerit Egiptul și l-a făcut satrapie, adică provincie.",
"Sub Darius I cel Mare, între 522 și 486 î.H., imperiul a fost cel mai mare. Darius l-a împărțit în 20 de provincii conduse de satrapi, numiți ochii și urechile regelui. A construit drumuri, mai ales Drumul Regal, a bătut o monedă de aur numită dareic și a creat trupele Cei zece mii de nemuritori: când unul cădea, era înlocuit imediat.",
"În anul 500 î.H. au început războaiele medice, dintre perși și greci. În 490 î.H. Darius a fost învins de atenieni la Marathon. Fiul lui, Xerxes I, a pierdut și el în fața grecilor. Imperiul Persan a căzut sub loviturile lui Alexandru cel Mare, regele Macedoniei. Capitalele erau Susa și Persepolis.",
"India. Centrul Indiei a fost Valea Gangelui, unde existau 16 regate conduse de rajahi. Chandragupta a fondat Imperiul Maurya. Cel mai mare rege a fost Așoka, care a ajutat la dezvoltarea budismului. Din această perioadă sunt Legile lui Manu, reguli religioase și morale scrise în versuri.",
"Au urmat Imperiul Kușan, care făcea comerț între China și Marea Mediterană, și Imperiul Gupta, epoca clasică a Indiei. Cel mai vestit rege Gupta a fost Chandragupta al II-lea, cu o mare înflorire culturală. Imperiul Gupta a fost distrus de huni.",
"Societatea din India era împărțită în caste: brahmanii, adică preoții; kșatrya, cei care conduceau și luptau; vaisya, agricultorii, meșteșugarii și negustorii; și sudra, care slujeau celelalte caste. Cei mai de jos erau intangibilii. Nu te puteai căsători cu cineva din altă castă și nu puteai trece în altă castă. Castele nu depindeau de avere, ci de cultura ariană.",
"China. Dinastiile chineze au fost, pe rând: Xia, Shang, Zhou, Qin și Han. Împăratul era numit fiul cerului și stăpânul pământului. Qin Shi Huangdi a unit China, a împărțit-o în 36 de provincii, cu capitala la Xianyang, și a terminat Marele Zid Chinezesc, ca apărare de barbari.",
"În timpul dinastiei Han, sub împăratul Wen-ti, funcționarii învățau în școli și dădeau examene. Au avut loc răscoalele Sprâncenelor Roșii și Turbanelor Galbene. În anul 220 imperiul s-a împărțit în trei regate: Wei, Shu și Wu. Societatea chineză avea aristocrați, oameni liberi și sclavi."
],

{id:"t5",nr:"Tema 5",title:"Cultura și civilizația Orientului Antic",color:"#6d28d9",
explain:[
"Religia era foarte importantă: prin ea oamenii explicau natura și evenimentele. Toate popoarele Orientului Antic erau politeiste, adică credeau în mai mulți zei.",
"În Egipt zeii aveau chip de om, de animal sau amestecat. Amon-Ra era zeul soarelui și creatorul lumii. Osiris era zeul lumii morților. Isis era mama zeilor și ocrotea căsătoria. Seth era zeul răului. Thot era zeul lunii și al înțelepciunii, înfățișat ca ibis sau babuin, iar lui i se atribuie inventarea scrisului. Bastet era zeița-pisică. Fiecare capitală avea zeul ei: Ra la Heliopolis, Ptah la Memfis, Amon la Teba.",
"În Mesopotamia, Anu era zeul cerului, Enlil al aerului, Enki-Ea al apelor dulci și al dreptății, Ninhursag era zeița-mamă, iar Inanna ocrotea dragostea. În Babilon zeul principal era Marduk.",
"În China zeul suprem era cerul, iar regii se numeau fiii cerului. Chinezii respectau cultul strămoșilor. Confucius a creat confucianismul, cu reguli morale și virtuți, iar Lao Zi a creat taoismul.",
"În India, Brahma era creatorul lumii, Vișnu era ocrotitorul, Șiva era distrugătorul, iar Ganesha, cu cap de elefant, era zeul învățăturii. Lakshmi era zeița bogăției, sărbătorită de Diwali. India este patria mai multor religii: brahmanismul, jainismul, șivaismul, vișnuismul și budismul.",
"Știința a apărut din nevoi practice: măsurarea pământului, calcularea recoltei, revărsările râurilor și vindecarea oamenilor. Mesopotamienii numărau în 60. De aceea ora are 60 de minute, ziua are 24 de ore, iar cercul 360 de grade. Egiptenii cunoșteau aritmetica și geometria și măsurau lichidele în hekata, de 4 litri și jumătate. Indienii au inventat sistemul zecimal și cifra zero. Chinezii au aflat că cercul e de ceva mai mult de trei ori mai lung decât diametrul.",
"Mesopotamienii aveau săptămâna de 7 zile și puteau prevedea eclipsele. Tot acolo a apărut astrologia. Chinezii au făcut o hartă a cerului cu 2.500 de stele. Medicii antici aveau specializări: dentiști, chirurgi, medici pentru inimă și pentru ochi. Chinezii au introdus anestezia și acupunctura, iar indienii au scris tratatul Ayurveda, adică știința vieții.",
"Artele. Simbolul Egiptului sunt piramidele: piramida în trepte a lui Zoser și piramidele de la Giza ale lui Kheops, Khefren și Mikerinos. Piramida lui Kheops este una dintre minunile lumii. Tot în Egipt sunt templele de la Karnak și Luxor. În Mesopotamia se construiau zigurate și palate-fortărețe. Chinezii aveau acoperișuri curbate ca aripile de fazan. Indienii au construit templul Marea Stupă.",
"În sculptură sunt vestite Marele Sfinx de la Giza, masca de aur a lui Tutankhamon, statuile lui Gudea, Stindardul din Ur și soldații din ceramică din mormântul lui Qin Shi Huangdi. Codul lui Hammurabi este sculptat pe Stela de la Susa, aflată la Muzeul Luvru din Paris. În China caligrafia era o artă în sine, iar pictorii iubeau peisajele cu munți.",
"Multe invenții ale Orientului Antic le folosim și azi: sumerienii au inventat roata, fenicienii sticla și purpura, indienii șahul, iar chinezii hârtia, porțelanul, mătasea, busola, ceasul cu apă și praful de pușcă."
],

{id:"t6",nr:"Tema 6",title:"Apariția scrisului",color:"#1d4ed8",
explain:[
"Odată cu scrisul se termină Preistoria și începe perioada istorică. Scrisul a apărut în Orientul Antic, ca să se noteze recoltele, mărfurile, numărul oamenilor și datoriile față de templu sau de rege. Cei care scriau se numeau scribi. Scrisul îl cunoșteau preoții și unii funcționari.",
"Prima formă de scriere a fost pictograma, un desen care înseamnă un obiect sau o idee. În Mesopotamia, la sfârșitul mileniului al IV-lea î.H., a apărut scrierea cuneiformă, cu semne în formă de cuie, pe tăblițe de lut. Avea circa 600 de semne. Regele Assurbanipal a înființat la Ninive o bibliotecă uriașă de tăblițe.",
"Egiptenii scriau cu hieroglife, adică desene de oameni, animale și obiecte. Scrierea egipteană avea circa 750 de hieroglife. Mai târziu a apărut scrierea hieratică, pentru textele religioase, și cea demotică, adică populară. Hieroglifele au fost descifrate în 1822 de savantul francez Jean-François Champollion, cu ajutorul Pietrei de la Rosetta.",
"În India primele scrieri sunt inscripțiile lui Așoka. În China, între 2000 și 1700 î.H., a apărut o scriere pictografică cu circa două mii de semne, care se folosește și astăzi.",
"Alfabetul fenician, din jurul anului 1000 î.H., avea 22 de litere, doar consoane. Din el provin alfabetele latin, grec și ebraic. Grecii au adăugat vocalele: a, e, i, o, u. Litera feniciană alef a devenit alfa, iar bet a devenit beta. De aici vine cuvântul alfabet. Romanii aveau alfabetul latin cu 23 de litere, din care vin și literele noastre.",
"Se scria pe materiale diferite. În Mesopotamia pe tăblițe de argilă, cu bețișoare din trestie. În Egipt pe papirus, piatră și pânză de in. În India pe frunze uscate de palmier. În China pe oase, bambus și mătase, cu o pensulă din păr de cămilă.",
"Pentru foaia de papirus, miezul plantei se tăia în fâșii subțiri, care se puneau în două straturi, unul orizontal și unul vertical. Apoi se presau, se uscau la soare și se băteau cu ciocanul. Foile lipite formau un sul de până la 45 de metri. Hârtia a fost inventată în China de Tsai Lun, în anul 98, din cânepă, pânză și bumbac.",
"Literatura avea mituri, povestiri, poeme, legende, imnuri, fabule, învățături și proverbe. În Mesopotamia s-a scris Epopeea lui Ghilgameș. În Egipt, Cartea morților și Povestea lui Sinuhet. În India, poemele Mahabharata și Ramayana. În China, Cartea cântecelor și Notele istorice ale lui Sima Qian."
],

const pick=a=>a[Math.floor(Math.random()*a.length)];
const T=id=>TOPICS.find(t=>t.id===id);
function fold(t){return String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[șş]/g,"s").replace(/[țţ]/g,"t").replace(/[.,!?;:"'„”“«»()\-–—]/g," ").replace(/\s+/g," ").trim();}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function sim(a,b){a=fold(a);b=fold(b);const L=Math.max(a.length,b.length)||1;return 1-lev(a,b)/L;}
const ROM={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8,IX:9,X:10,XI:11,XII:12,XV:15,XVI:16,XIX:19,XXI:21};
const ORD={2:"doilea",3:"treilea",4:"patrulea",5:"cincilea",6:"șaselea",7:"șaptelea",8:"optulea",9:"nouălea",10:"zecelea",11:"unsprezecelea",12:"doisprezecelea",15:"cincisprezecelea",16:"șaisprezecelea",19:"nouăsprezecelea",21:"douăzeci și unulea"};
function speakable(t){return String(t)
 .replace(/„|”|“|"/g,"")
 .replace(/\bal ([IVX]+)-lea\b/g,(m,r)=>ROM[r]&&ORD[ROM[r]]?"al "+ORD[ROM[r]]:m)
 .replace(/mileniul I\b/g,"mileniul întâi").replace(/sec\. I î\.H\./g,"secolul întâi î.H.")
 .replace(/sec\. ([IVX]+)[–-]([IVX]+)/g,(m,a,b)=>ROM[a]&&ROM[b]?"secolele "+ROM[a]+" și "+ROM[b]:m)
 .replace(/\bsec\. /g,"secolul ")
 .replace(/(\d{1,4})\s*[–-]\s*(\d{1,4})/g,"$1 până în $2")
 .replace(/î\.H\./g,"înainte de Hristos").replace(/d\.H\./g,"după Hristos")
 .replace(/\bcca /g,"circa ").replace(/___/g,"ceva");}

function roVoice(){const vs=VOICES.filter(v=>v.lang&&v.lang.toLowerCase().replace("_","-").startsWith("ro"));return vs.find(v=>/google|natural|premium|enhanced/i.test(v.name))||vs[0]||null;}

function sayOne(text,t){return new Promise(res=>{
 if(t!==tok)return res();const txt=speakable(text);
 if(useClaudeVoice()){CAP.tts.speak(txt,{language:"ro",rate:S.rate}).then(res,res);return;}
 if("speechSynthesis" in window){const u=new SpeechSynthesisUtterance(txt);const v=roVoice();if(v)u.voice=v;u.lang="ro-RO";u.rate=S.rate;
  let done=false;const fin=()=>{if(!done){done=true;clearTimeout(tm);res();}};u.onend=fin;u.onerror=fin;
  const tm=setTimeout(fin,Math.max(6000,txt.length*110/S.rate));speechSynthesis.speak(u);return;}
 res();});}
async function say(parts){stopSpeak();const t=tok;if(typeof parts==="string")parts=[{t:parts}];
 for(const p of parts){if(t!==tok)return;if(p.el)p.el.classList.add("speaking");await sayOne(p.t,t);if(p.el)p.el.classList.remove("speaking");}}

const NativeSR=window.SpeechRecognition||window.webkitSpeechRecognition;
let nativeBroken=(function(){try{return window.self!==window.top;}catch(e){return true;}})(),listenCb=null,dictBuf="",dictLang=true,listening=false;
function setupDict(){const d=CAP.dict;
 d.onPartial&&d.onPartial(({text})=>{if(listenCb)listenCb.partial((dictBuf+" "+text).trim());});
 d.onFinal&&d.onFinal(({text})=>{dictBuf+=" "+text;if(listenCb)listenCb.partial(dictBuf.trim());});
 d.onState&&d.onState(({state,reason})=>{if(state==="idle"){if(reason==="unavailable"&&dictLang)dictLang=false;if(listenCb){const cb=listenCb;listenCb=null;listening=false;cb.done(dictBuf.trim());}}});}
function canListen(){return !!CAP.dict||(NativeSR&&!nativeBroken);}
// must be called straight from a click
function listen(onPartial,maxMs){return new Promise(resolve=>{
 stopSpeak();listening=true;
 if(CAP.dict){dictBuf="";listenCb={partial:onPartial,done:resolve};
  CAP.dict.start(dictLang?{language:"ro"}:undefined).catch(e=>{listenCb=null;listening=false;if(e&&e.code==="not_granted")CAP.dict=null;if(e&&e.code==="unavailable")dictLang=false;resolve(null);});
  setTimeout(()=>{try{listening&&CAP.dict&&CAP.dict.stop();}catch(e){}},maxMs||25000);return;}
 if(NativeSR&&!nativeBroken){const r=new NativeSR();r.lang="ro-RO";r.interimResults=true;r.continuous=true;let txt="",fin=false;
  r.onresult=e=>{txt="";for(let i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript+" ";txt=txt.trim();onPartial&&onPartial(txt);};
  r.onerror=e=>{if(/not-allowed|service-not-allowed/.test(e.error))nativeBroken=true;if(!fin){fin=true;listening=false;resolve(txt||null);}};
  r.onend=()=>{if(!fin){fin=true;listening=false;resolve(txt);}};
  try{r.start();window._sr=r;setTimeout(()=>{try{r.stop();}catch(e){}},maxMs||25000);}catch(e){nativeBroken=true;listening=false;resolve(null);}return;}
 listening=false;resolve(null);});}
function stopListen(){try{CAP.dict&&CAP.dict.stop();}catch(e){}try{window._sr&&window._sr.stop();}catch(e){}}


/* ===== AI: Claude (claude.ai), propria cheie API sau server proxy ===== */
const MODEL="claude-haiku-5-5";
function hasAI(){return !!CAP.sample||!!S.apiKey||!!S.proxy;}
async function ai(input){
 if(CAP.sample){const r=await CAP.sample(input,{cache:false,modelTier:"default"});return r.text||"";}
 const messages=typeof input==="string"?[{role:"user",content:input}]:input;
 const body=JSON.stringify({model:MODEL,max_tokens:700,messages});
 let res;
 if(S.proxy){res=await fetch(S.proxy,{method:"POST",headers:{"content-type":"application/json"},body});}
 else if(S.apiKey){res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body});}
 else throw {code:"no_ai"};
 if(res.status===429)throw {code:"rate_limited"};
 if(res.status===401||res.status===403)throw {code:"bad_key"};
 if(!res.ok)throw {code:"http_"+res.status};
 const j=await res.json();return (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");}

/* ===== exercises ===== */
let EX=null;
function mkKey(tid,k,i){return tid+"|"+k+"|"+i;}
function qFrom(key){const[tid,k,i]=key.split("|");const t=T(tid);if(!t)return null;const n=+i;
 if(k==="quiz"){const[q,a,...w]=t.quiz[n].split("|");return{k:"choice",prompt:q,ans:a,opts:shuf([a,...w]),item:key,tc:t.color};}
 if(k==="tf"){const[s,v,fix]=t.tf[n].split("|");return{k:"choice",two:1,sub:"Adevărat sau fals?",prompt:s,ans:v==="1"?"Adevărat":"Fals",opts:["Adevărat","Fals"],fix,item:key};}
 if(k==="fill"){const[q,a]=t.fill[n].split("|");return{k:"type",sub:"Completează:",prompt:q,ans:a,item:key};}
 if(k==="match"){const[a,b]=t.cards[n].split("|");const others=t.cards.filter((_,j)=>j!==n).map(c=>c.split("|")[0]);return{k:"choice",sub:"Ce termen are această explicație?",prompt:b,ans:a,opts:shuf([a,...shuf(others).slice(0,3)]),item:key};}
 return null;}
function genQs(t,a){const N=10;let qs=[];
 if(a==="quiz")qs=shuf(t.quiz.map((_,i)=>i)).slice(0,N).map(i=>qFrom(mkKey(t.id,"quiz",i)));
 if(a==="tf")qs=shuf(t.tf.map((_,i)=>i)).slice(0,N).map(i=>qFrom(mkKey(t.id,"tf",i)));
 if(a==="fill")qs=shuf(t.fill.map((_,i)=>i)).map(i=>qFrom(mkKey(t.id,"fill",i)));
 if(a==="match")qs=shuf(t.cards.map((_,i)=>i)).slice(0,8).map(i=>{if(Math.random()<.5)return qFrom(mkKey(t.id,"match",i));const[a1,b1]=t.cards[i].split("|");const others=t.cards.filter((_,j)=>j!==i).map(c=>c.split("|")[1]);return{k:"choice",sub:"Ce înseamnă?",prompt:a1,ans:b1,opts:shuf([b1,...shuf(others).slice(0,3)]),item:mkKey(t.id,"match",i)};});
 if(a==="chrono"){const ev=t.chrono.map((c,i)=>{const[e,d]=c.split("|");return{e,d,i};});qs=[...Array(5)].map(()=>{const sel=shuf(ev).slice(0,4).sort((x,y)=>x.i-y.i);return{k:"order",sub:"Atinge evenimentele în ordinea în care s-au petrecut:",items:sel,tiles:shuf(sel.map((_,j)=>j))};});}
 if(a==="oral")qs=shuf(t.oral.map((_,i)=>i)).map(i=>{const[q,m,kw]=t.oral[i].split("|");return{k:"oral",prompt:q,model:m,kw:kw.split(","),tid:t.id};});
 return qs.filter(Boolean);}

 if(q.k==="oral"){const done=EX.state!=="ask";
  if(!done){body+=canListen()?`<button class="mic big ${listening?"on":""}" data-act="spk">${listening?"👂 Te ascult… atinge ca să termini":"🎤 Atinge și răspunde"}</button><div class="heard" id="heard">${esc(EX.heard||"")}</div>`:"";
   body+=`<label for="otin">${canListen()?"Sau scrie răspunsul:":"Scrie răspunsul (microfonul nu e disponibil aici):"}</label><input id="otin" class="tin" autocomplete="off" value="${esc(EX.typed)}" placeholder="Răspunsul tău…"><button class="btn primary wide" data-act="checkoral">Verifică</button><button class="btn wide" data-act="showmodel">Nu știu — arată-mi răspunsul</button>`;}
  if(EX.selfAsk&&!EX.fb)body+=`<div class="fb no"><b>Răspunsul corect:</b> ${esc(q.model)}</div><div class="row2"><button class="btn good" data-self="1">👍 Am știut</button><button class="btn" data-self="0">🔁 Încă nu</button></div>`;}
 if(EX.busy)body+=`<div class="note" style="margin-top:12px">Profesorul verifică răspunsul…</div>`;
 if(EX.fb)body+=`<div class="fb ${EX.fb.ok?"ok":"no"}">${EX.fb.html}</div><button class="btn primary wide" data-act="next">Mai departe</button>`;
 return topBar(`${act.ic} ${act.t}`,back)+`<div class="pad">${body}</div>`;}

const PRAISE=["Bravo!","Super!","Excelent!","Foarte bine!","Perfect!"];
function grade(ok,html,speakTxt){const q=EX.qs[EX.i];EX.state="done";EX.busy=false;if(ok)EX.ok++;
 if(q.item){if(ok){if(S.mist[q.item]){S.mist[q.item]--;if(S.mist[q.item]<=0)delete S.mist[q.item];}}else S.mist[q.item]=2;save();}
 EX.fb={ok,html};render();
 if(S.autoVoice)say(speakTxt||(ok?pick(PRAISE):"Nu chiar. Răspunsul corect este: "+(q.ans||q.model)));}
function checkTyped(){const q=EX.qs[EX.i];const v=($("#tin").value||"").trim();EX.typed=v;if(!v)return;
 const a=fold(q.ans),b=fold(v);
 if(a===b)return grade(true,`✅ ${pick(PRAISE)} <b>${esc(q.ans)}</b>`);
 if(sim(q.ans,v)>=.8)return grade(true,`✅ Aproape perfect! Se scrie: <b>${esc(q.ans)}</b>`,"Corect! Atenție la scriere: "+q.ans);
 grade(false,`❌ Corect este: <b>${esc(q.ans)}</b><small>Tu ai scris: ${esc(v)}</small>`);}
function kwScore(text,kw){const f=" "+fold(text)+" ";let hit=0;kw.forEach(k=>{const alts=k.split("/").map(x=>fold(x)).filter(Boolean);if(alts.some(a=>f.includes(a)))hit++;});return hit;}
async function gradeOral(ans){const q=EX.qs[EX.i];EX.heard=ans;const said=`<small><b>Ai spus:</b> ${esc(ans)}</small>`;
 if(hasAI()){EX.busy=true;render();
  try{const t=T(q.tid);const prompt=`Ești profesor de istorie pentru clasa a V-a. Verifici răspunsul oral al unui elev, după lecția de mai jos.\nLECȚIA:\n${t.explain.join("\n")}\n\nÎNTREBAREA: ${q.prompt}\nRĂSPUNS MODEL: ${q.model}\nRĂSPUNSUL ELEVULUI (transcris din voce, pot fi mici greșeli de transcriere): ${ans}\n\nDecide dacă elevul a spus ideile principale (nu cere formulare exactă). Răspunde DOAR cu JSON: {"ok":true sau false,"feedback":"2 propoziții scurte în română, calde: ce a spus bine și ce lipsește"}`;
   const j=parseJSON(await ai(prompt));
   if(j&&typeof j.ok==="boolean"){return grade(j.ok,`${j.ok?"✅":"🔁"} ${esc(j.feedback||"")}${said}<small><b>Răspuns model:</b> ${esc(q.model)}</small>`,(j.feedback||"")+(j.ok?"":" Răspunsul corect: "+q.model));}
  }catch(e){}EX.busy=false;}
 const hit=kwScore(ans,q.kw);const need=Math.max(1,Math.ceil(q.kw.length*0.6));const ok=hit>=need;
 grade(ok,`${ok?"✅ "+pick(PRAISE)+" Ai spus ideile principale.":"🔁 Îți lipsesc câteva idei."}${said}<small><b>Răspuns model:</b> ${esc(q.model)}</small>`,ok?pick(PRAISE)+" Ai spus ideile principale.":"Îți lipsesc câteva idei. Răspunsul corect: "+q.model);}

/* ===== events ===== */
function bindCommon(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const v=JSON.parse(b.dataset.go);if(v.v==="ex")EX=null;if(v.v==="tutor"||v.v==="ask")CHAT.key=null;go(v);if(v.v==="ex")autoAudio();});
 document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>ACT[b.dataset.act]&&ACT[b.dataset.act](b)));
 document.querySelectorAll("[data-para]").forEach(b=>b.onclick=()=>{const t=T(VIEW.t);say([{t:t.explain[+b.dataset.para],el:b.parentElement}]);});
 document.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>{b.classList.toggle("flip");const t=T(VIEW.t);const[a,d]=t.cards[+b.dataset.card].split("|");if(b.classList.contains("flip"))say(a+". "+d);else stopSpeak();});
 const rs=$("#rate");if(rs)rs.oninput=()=>{S.rate=+rs.value;save();$("#ratev").textContent=rs.value;};
 document.querySelectorAll("[data-voice]").forEach(b=>b.onclick=()=>{S.voice=b.dataset.voice;save();render();});
 const av=$("#autov");if(av)av.onchange=()=>{S.autoVoice=av.checked;save();};}
const ACT={
 stop:()=>{stopSpeak();stopListen();},
 readall:()=>{const t=T(VIEW.t);const els=[...document.querySelectorAll(".para")];say(t.explain.map((p,i)=>({t:p,el:els[i]})));},
 general:()=>{EX=null;go({v:"ex",a:"general"});autoAudio();},
 review:()=>{EX=null;go({v:"ex",a:"review"});autoAudio();},
 again:()=>{EX=null;render();autoAudio();},
 sayq:()=>{const q=EX.qs[EX.i];say(q.k==="choice"&&!q.two?q.prompt+". Variante: "+q.opts.join("; "):q.prompt);},
 check:checkTyped,
 checko:()=>{const q=EX.qs[EX.i];const ok=EX.picked.every((ti,pos)=>ti===pos);grade(ok,ok?`✅ ${pick(PRAISE)} Ordinea este corectă.`:`❌ Ordinea corectă:<br>${q.items.map((it,j)=>`${j+1}. ${esc(it.e)} — <b>${esc(it.d)}</b>`).join("<br>")}`,ok?pick(PRAISE):"Nu chiar. Uită-te la ordinea corectă.");},
 next:()=>{EX.i++;EX.state="ask";EX.fb=null;EX.typed="";EX.picked=[];EX.chosen=null;EX.heard="";EX.selfAsk=false;render();autoAudio();},
 spk:()=>{if(listening){stopListen();return;}
  listen(t=>{EX.heard=t;const h=$("#heard");if(h)h.textContent=t;},40000).then(t=>{render();if(!t){const h=$("#heard");if(h)h.textContent="Nu te-am auzit. Mai încearcă sau scrie răspunsul.";return;}gradeOral(t);});render();},
 checkoral:()=>{const v=($("#otin").value||"").trim();EX.typed=v;if(!v)return;gradeOral(v);},
 showmodel:()=>{EX.selfAsk=true;render();say("Răspunsul corect: "+EX.qs[EX.i].model);},
 settest:()=>say("Bună! Eu sunt vocea care îți citește lecțiile de istorie."),
 reset:(b)=>{if(b.dataset.sure){S.prog={};S.mist={};save();go({v:"home"});}else{b.dataset.sure=1;b.textContent="Atinge încă o dată ca să confirmi";}},
 rename:()=>{S.name="";save();go({v:"home"});},
 send:()=>chatSend(),
 mic:()=>chatMic(),
 restart:()=>{CHAT={key:null,msgs:[],busy:false};render();},
 aisave:async()=>{const k=($("#akey").value||"").trim(),p=($("#aproxy").value||"").trim();if(k)S.apiKey=k;S.proxy=p;save();const m=$("#aimsg");if(m)m.textContent="Verific…";
  try{const t=await ai("Răspunde doar cu cuvântul: gata");render();const m2=$("#aimsg");if(m2)m2.textContent="✅ Funcționează: "+t.slice(0,40);}
  catch(e){const m2=$("#aimsg");if(m2)m2.textContent=e&&e.code==="bad_key"?"❌ Cheia nu este corectă.":e&&e.code==="no_ai"?"Introdu o cheie sau o adresă.":"❌ Nu merge acum ("+(e&&e.code||"eroare")+").";}},
 aiclear:()=>{S.apiKey="";S.proxy="";save();render();}
};
function autoAudio(){if(!S.autoVoice||!EX)return;const q=EX.qs[EX.i];if(!q)return;if(q.k==="oral"||q.k==="type"||q.two)say(q.prompt);}
function bindEx(){
 document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{const q=EX.qs[EX.i];EX.chosen=b.dataset.opt;const ok=EX.chosen===q.ans;
  grade(ok,ok?`✅ ${pick(PRAISE)}`:`❌ Corect: <b>${esc(q.ans)}</b>${q.fix?`<small>${esc(q.fix)}</small>`:""}`,ok?pick(PRAISE):(q.fix?"Nu chiar. "+q.fix:"Nu chiar. Corect este: "+q.ans));});
 document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{EX.picked.push(+b.dataset.pick);render();});
 document.querySelectorAll("[data-unpick]").forEach(b=>b.onclick=()=>{EX.picked.splice(+b.dataset.unpick,1);render();});
 document.querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{const ok=b.dataset.self==="1";EX.selfAsk=false;grade(ok,ok?"✅ Bravo! Continuă tot așa.":"🔁 Recitește lecția și data viitoare va ieși.");});
 const t=$("#tin");if(t){t.addEventListener("keydown",e=>{if(e.key==="Enter")checkTyped();});t.addEventListener("input",()=>EX.typed=t.value);if(EX.state==="ask")setTimeout(()=>t.focus(),50);}
 const o=$("#otin");if(o){o.addEventListener("input",()=>EX.typed=o.value);o.addEventListener("keydown",e=>{if(e.key==="Enter")ACT.checkoral();});}}

/* ===== AI: tutor & ask ===== */
let CHAT={key:null,msgs:[],busy:false};
function parseJSON(t){try{return JSON.parse(t);}catch(e){}const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}return null;}
function tutorSystem(t){return `Ești „domnul profesor Andrei”, un profesor de istorie prietenos și răbdător. Vorbești cu ${S.name}, un elev de clasa a V-a din Republica Moldova, care învață după manualul „Istoria românilor și universală”. Tema de azi: ${t.nr} „${t.title}”. Subiecte: ${t.tutor}.
LECȚIA (singura sursă de fapte pe care o folosești):
${t.explain.join("\n")}
Cum lucrezi:
- Vorbești DOAR în română, simplu, ca pentru un copil de 10–11 ani. Replicile tale sunt citite cu voce tare, deci: fără liste, fără markdown, fără emoji, maximum 3 propoziții scurte.
- Pui O SINGURĂ întrebare odată despre lecție, de la ușor la mai greu, ca la o lecție orală.
- După răspunsul elevului: spui scurt dacă e corect, îl lauzi sincer, corectezi blând ce a greșit (cu răspunsul corect din lecție), apoi pui întrebarea următoare.
- Dacă elevul nu știe, îi dai un indiciu sau îi explici pe scurt, apoi întrebi din nou altfel.
- Dacă elevul întreabă ceva, îi răspunzi pe scurt din lecție și revii la întrebări.
- Răspunsurile elevului vin din dictare vocală, deci pot avea mici greșeli de transcriere: nu le corecta ortografia.
- Nu inventa fapte care nu sunt în lecție.`;}
function askSystem(){return `Ești un profesor de istorie răbdător care explică în română unui elev de clasa a V-a (${S.name}) temele despre Orientul Antic din manualul „Istoria românilor și universală”. Răspunzi scurt (maximum 5 propoziții), simplu, cu un exemplu dacă ajută. Răspunsul tău va fi citit cu voce, deci fără liste, fără markdown, fără emoji. Folosește doar faptele din lecțiile de mai jos; dacă întrebarea nu e despre ele, spune blând că aplicația e pentru aceste teme.
LECȚIILE:
${TOPICS.map(t=>t.nr+". "+t.title+"\n"+t.explain.join("\n")).join("\n\n")}`;}
function chatScreen(){const isAsk=VIEW.v==="ask";const t=isAsk?null:T(VIEW.t);const key=isAsk?"ask":"t"+t.id;
 if(CHAT.key!==key){CHAT={key,msgs:[],busy:false};if(!isAsk&&hasAI())setTimeout(()=>callAI(),60);}
 const back=isAsk?'{"v":"home"}':`{"v":"topic","t":"${t.id}"}`;
 if(!hasAI())return topBar(isAsk?"🙋 Întreabă profesorul":"🧑‍🏫 Discută cu profesorul",back)+`<div class="pad"><p class="note">Profesorul AI nu este pornit încă. Un părinte îl poate porni din „Setări” → „Profesorul AI”. Până atunci, exersează cu „Răspunde cu voce”.</p></div>`;
 const intro=isAsk?"Întreabă orice despre temele 1–6, de exemplu: „Ce este un zigurat?” sau „De ce Egiptul depindea de Nil?”":`Profesorul te întreabă despre „${t.title}”. ${canListen()?"Atinge 🎤, spune răspunsul, apoi atinge din nou ca să-l trimiți.":"Scrie răspunsul și apasă ➤."}`;
 return topBar(isAsk?"🙋 Întreabă profesorul":"🧑‍🏫 Discută cu profesorul",back)+`<div class="pad chat"><div class="note">${esc(intro)}</div>
 <div id="msgs">${CHAT.msgs.map(msgHTML).join("")}${CHAT.busy?`<div class="msg ai"><i>Profesorul se gândește…</i></div>`:""}</div>
 ${CHAT.msgs.length>2?`<button class="btn wide" data-act="restart">Începe din nou</button>`:""}</div>
 <div class="composer"><div class="crow">${canListen()?`<button class="mic ${listening?"on":""}" aria-label="Vorbește" data-act="mic">${listening?"⏹":"🎤"}</button>`:""}<input id="cin" placeholder="${isAsk?"Întrebarea ta…":"Răspunsul tău…"}" autocomplete="off"><button class="btn primary" aria-label="Trimite" data-act="send" ${CHAT.busy?"disabled":""}>➤</button></div></div>`;}
function msgHTML(m,i){if(m.role==="user")return `<div class="msg me">${esc(m.content)}</div>`;return `<div class="msg ai">${canSpeak()?`<button class="pl" aria-label="Ascultă" data-replay="${i}">▶</button>`:""}${esc(m.content)}</div>`;}
function bindChat(){const i=$("#cin");if(i)i.addEventListener("keydown",e=>{if(e.key==="Enter")chatSend();});
 document.querySelectorAll("[data-replay]").forEach(b=>b.onclick=()=>say(CHAT.msgs[+b.dataset.replay].content));
 const m=$("#msgs");if(m&&m.lastElementChild)m.lastElementChild.scrollIntoView({block:"end"});}
async function callAI(){if(!hasAI()||CHAT.busy)return;CHAT.busy=true;render();
 const isAsk=CHAT.key==="ask";const sys=isAsk?askSystem():tutorSystem(T(CHAT.key.slice(1)));
 const hist=CHAT.msgs.map(m=>({role:m.role,content:m.content}));
 const start={role:"user",content:sys+"\n\n(Începe acum: salută-l pe elev pe nume și pune prima întrebare.)"};
 let input;
 if(!hist.length)input=[start];
 else if(hist[0].role==="assistant")input=[start,...hist];
 else input=[{role:"user",content:sys+"\n\nPrimul mesaj al elevului: "+hist[0].content},...hist.slice(1)];
 try{const txt=(await ai(input)).trim();
  CHAT.msgs.push({role:"assistant",content:txt});CHAT.busy=false;render();if(S.autoVoice)say(txt);}
 catch(e){CHAT.busy=false;CHAT.msgs.push({role:"assistant",content:e&&e.code==="rate_limited"?"Prea multe mesaje deodată. Așteaptă puțin și încearcă din nou.":e&&e.code==="not_granted"?"Profesorul nu are permisiunea să pornească. Verifică permisiunile aplicației.":e&&e.code==="bad_key"?"Cheia profesorului AI nu este corectă. Roagă un părinte să o verifice în Setări.":"Nu am putut răspunde acum. Încearcă din nou."});render();}}
function chatSend(){const i=$("#cin");if(!i||CHAT.busy)return;const v=i.value.trim();if(!v)return;stopSpeak();CHAT.msgs.push({role:"user",content:v});callAI();}
function chatMic(){if(listening){stopListen();return;}
 listen(t=>{const i=$("#cin");if(i)i.value=t;},40000).then(t=>{render();if(t){const i=$("#cin");if(i){i.value=t;chatSend();}}});render();}

function settingsScreen(){const rv=roVoice();
 return topBar("Setări",'{"v":"home"}')+`<div class="pad">
 <h3 class="gh">Vocea</h3>
 ${CAP.tts?`<div class="seg"><button class="${S.voice!=="phone"?"on":""}" data-voice="auto">Vocea Claude</button><button class="${S.voice==="phone"?"on":""}" data-voice="phone">Vocea telefonului</button></div>`:""}
 <div class="note">${CAP.tts&&S.voice!=="phone"?"Se folosește vocea Claude.":rv?"Voce română: <b>"+esc(rv.name)+"</b>":"Nu am găsit o voce în limba română pe acest dispozitiv.<br><small>Android: Setări → Accesibilitate → Text în vorbire → Google → instalează limba română. iPhone: Setări → Accesibilitate → Conținut vorbit → Voci → Română.</small>"}</div>
 <button class="btn wide" data-act="settest">🔊 Ascultă un test</button>
 <label for="rate">Viteza vocii: <b id="ratev">${S.rate}</b></label><input type="range" id="rate" min="0.7" max="1.3" step="0.05" value="${S.rate}">
 <label class="chk"><input type="checkbox" id="autov" ${S.autoVoice?"checked":""}> Citește automat întrebările și răspunsurile</label>
 <h3 class="gh">Microfonul</h3><div class="note">${canListen()?"✅ Poți răspunde cu vocea.":"Recunoașterea vocii nu e disponibilă aici. Răspunsurile orale se pot scrie. Pe telefon merge cel mai bine în Chrome (Android) sau în claude.ai."}</div>
 <h3 class="gh">Profesorul AI (pentru părinți)</h3>
 ${CAP.sample?`<div class="note">✅ Profesorul AI merge prin contul Claude.</div>`:`<div class="note">${S.apiKey||S.proxy?"✅ Profesorul AI este pornit"+(S.proxy?" prin server.":" cu cheia ta."):"Pentru discuția cu profesorul și verificarea răspunsurilor orale, introdu o cheie API Anthropic (de pe platform.claude.com) sau adresa serverului tău. Cheia rămâne doar pe acest telefon."}</div>
 <label for="akey">Cheie API</label><input id="akey" class="tin" type="password" autocomplete="off" placeholder="${S.apiKey?"•••••• salvată":"sk-ant-…"}">
 <label for="aproxy">sau adresa serverului (opțional)</label><input id="aproxy" class="tin" type="url" autocomplete="off" value="${esc(S.proxy||"")}" placeholder="https://….workers.dev">
 <div class="row2"><button class="btn primary" data-act="aisave">Salvează și verifică</button><button class="btn danger" data-act="aiclear">Șterge</button></div><div class="heard" id="aimsg"></div>`}
 <h3 class="gh">Profil</h3><button class="btn wide" data-act="rename">Schimbă numele (${esc(S.name)})</button><button class="btn wide danger" data-act="reset">Șterge tot progresul</button></div>`;}

render();
if("serviceWorker" in navigator&&location.protocol==="https:"){try{if(window.self===window.top)navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}}
</script></body></html>
